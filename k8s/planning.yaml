apiVersion: apps/v1
kind: Deployment
metadata:
  name: planning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planning
  template:
    metadata:
      labels:
        app: planning
    spec:
      containers:
        - name: planning
          image: choijaejun/voyageguard-planning:latest
          ports:
            - containerPort: 8081
          env:
            # RDS 접속정보 - 실제 값은 커밋 안 함, RDS 만든 뒤 kubectl로 별도 Secret 생성해서 주입
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: planning-db-secret
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: planning-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planning-db-secret
                  key: password
            # 같은 K8s 클러스터 안의 Service 이름으로 접근 - 비밀 아니라서 그냥 값으로 넣음
            - name: SALES_SERVICE_BASE_URL
              value: "http://sales:8082"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: planning
spec:
  selector:
    app: planning
  ports:
    - port: 8081
      targetPort: 8081
