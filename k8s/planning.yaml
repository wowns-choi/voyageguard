apiVersion: apps/v1
kind: Deployment
metadata:
  name: planning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planning
  template:
    metadata:
      labels:
        app: planning
    spec:
      containers:
        - name: planning
          image: choijaejun/voyageguard-planning:72c27c9
          ports:
            - containerPort: 8081
          env:
            # RDS 접속정보 - 실제 값은 커밋 안 함, RDS 만든 뒤 kubectl로 별도 Secret 생성해서 주입
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: planning-db-secret
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: planning-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planning-db-secret
                  key: password
            # 같은 K8s 클러스터 안의 Service 이름으로 접근 - 비밀 아니라서 그냥 값으로 넣음
            - name: SALES_SERVICE_BASE_URL
              value: "http://sales:8082"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # 클라우드(t3.medium, 동시 기동)에선 로컬보다 부팅이 훨씬 느려서(실측 60~90초대)
          # readiness/liveness의 initialDelaySeconds만으론 부팅 중 강제 재시작이 실제로
          # 발생함 - startupProbe가 통과할 때까지 readiness/liveness 자체를 비활성화하는
          # K8s 표준 패턴으로 전환(최대 5초*30회=150초까지 부팅 유예)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: planning
spec:
  selector:
    app: planning
  ports:
    - port: 8081
      targetPort: 8081
