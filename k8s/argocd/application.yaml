# ArgoCD Application - 이 레포(voyageguard)의 k8s/ 디렉토리를 GitOps 대상으로 감시.
# 서비스 레포(planning/sales/payment/auth) CI가 이미지 빌드 후 이 레포의 k8s/<서비스>.yaml
# 이미지 태그를 커밋하면, ArgoCD가 그 변경을 감지해서 자동으로 클러스터에 동기화함.
#
# observability/(Helm values, install.sh로 별도 관리)와 create-secrets.sh(적용 대상 아님),
# argocd/(이 파일 자신)는 동기화 대상에서 제외.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voyageguard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wowns-choi/voyageguard.git
    targetRevision: main
    path: k8s
    directory:
      exclude: "{observability/**,create-secrets.sh,argocd/**}"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
