apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: choijaejun/voyageguard-auth:b343ba4
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: password
            # 구글 시크릿 없이도 기동은 되게, Secret 안에 더미값을 넣어둘 것(docker-compose 때와 동일 이유) -
            # K8s Secret은 compose의 ${VAR:-기본값} 같은 자동 대체가 없어서, 값 자체를 더미로 채워야 함
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: google-client-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # 클라우드(t3.medium, 동시 기동)에선 로컬보다 부팅이 훨씬 느려서(실측 60~90초대)
          # readiness/liveness의 initialDelaySeconds만으론 부팅 중 강제 재시작이 실제로
          # 발생함 - startupProbe가 통과할 때까지 readiness/liveness 자체를 비활성화하는
          # K8s 표준 패턴으로 전환(최대 5초*30회=150초까지 부팅 유예)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - port: 8084
      targetPort: 8084
