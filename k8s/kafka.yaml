apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # EBS 볼륨은 기본적으로 root 소유로 마운트되는데, apache/kafka 공식 이미지는
      # uid=1000(appuser)로 실행됨 - fsGroup 없으면 로그 디렉토리 쓰기 권한이 없어서
      # "AccessDeniedException"으로 컨테이너가 계속 크래시함(실제로 겪은 문제)
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports:
            - containerPort: 19092
            - containerPort: 19093
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:19093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            # 기본 로그 저장 경로가 /tmp 밑이라 파드 재시작 시 유실 위험 - 아래 영구 볼륨 경로로 명시 이동.
            # 마운트 루트가 아니라 하위 폴더(logs)로 지정 - EBS(ext4) 볼륨 루트에 자동 생성되는
            # lost+found 디렉토리를 Kafka가 "잘못된 토픽-파티션"으로 오인해 fatal fault로
            # 죽는 문제가 실제로 있었음(마운트 루트를 그대로 로그 디렉토리로 쓰면 항상 재현됨)
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data/logs"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
  # StatefulSet 전용 기능 - 파드마다 전용 영구 볼륨을 자동 생성해서 붙여줌.
  # Deployment였다면 파드 재시작마다 이 볼륨이 새로 생겨서 데이터가 매번 유실됐을 것
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  # headless Service(clusterIP: None) - StatefulSet 파드가 고유하고 안정적인 DNS 이름
  # (kafka-0.kafka 등)을 가지려면 필요함. 지금은 replica 1개라 체감 차이는 적지만,
  # 나중에 브로커를 늘리면(멀티 노드 클러스터) 이 방식이 꼭 필요해짐
  clusterIP: None
  # 기본값(false)이면 Ready 상태인 파드만 DNS에 노출됨 - 근데 kafka-0 자신이 Ready가
  # 되려면 컨트롤러 쿼럼(KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:19093)에 접속해야
  # 하는데, 그 "kafka"라는 이름 자체가 Ready 전엔 DNS에 없어서 영원히 못 뜨는 순환
  # 문제(닭이 먼저냐 달걀이 먼저냐)가 실제로 있었음 - true로 바꿔서 해결
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 19092
      targetPort: 19092
    - name: controller
      port: 19093
      targetPort: 19093
    - name: plaintext-host
      port: 9092
      targetPort: 9092
