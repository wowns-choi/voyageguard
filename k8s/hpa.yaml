# HPA(HorizontalPodAutoscaler) - CPU/메모리 사용률에 따라 파드 개수를 자동으로 늘리고 줄여주는 설정.
# metrics-server가 클러스터에 설치되어 있어야 동작함 (EKS 기본 설치 아님, 별도 설치 필요)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: planning-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: planning
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # OOMKill은 메모리 문제라 CPU만 봐선 못 잡음 - 메모리 사용률도 같이 감시해서 한계치
    # 도달 전에 미리 늘어나게 함. 두 지표 중 더 많은 replicas를 요구하는 쪽을 따름
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sales-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sales
  minReplicas: 1
  # RDS db.t4g.micro의 max_connections 한도 때문에 3으로 두면 레플리카가 동시에
  # HikariCP 커넥션을 열다가 "Too many connections"로 크래시 -> 재시작 중 메모리
  # 스파이크 -> HPA가 다시 늘림의 무한 루프에 실제로 빠졌음. 2로 낮춰서 방지
  # (근본 해결은 RDS 인스턴스 클래스 상향 또는 Hikari pool size 축소 - 추후 과제)
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
