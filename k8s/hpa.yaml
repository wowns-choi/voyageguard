# HPA(HorizontalPodAutoscaler) - CPU/메모리 사용률에 따라 파드 개수를 자동으로 늘리고 줄여주는 설정.
# metrics-server가 클러스터에 설치되어 있어야 동작함 (EKS 기본 설치 아님, 별도 설치 필요)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: planning-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: planning
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # OOMKill은 메모리 문제라 CPU만 봐선 못 잡음 - 메모리 사용률도 같이 감시해서 한계치
    # 도달 전에 미리 늘어나게 함. 두 지표 중 더 많은 replicas를 요구하는 쪽을 따름
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
