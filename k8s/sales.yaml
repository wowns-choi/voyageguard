apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales
  template:
    metadata:
      labels:
        app: sales
    spec:
      containers:
        - name: sales
          image: choijaejun/voyageguard-sales:f7f376b
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: sales-db-secret
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sales-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sales-db-secret
                  key: password
            # ElastiCache 접속정보 - RDS와 마찬가지로 실제 값은 Secret으로 별도 주입
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: sales-redis-secret
                  key: host
            # 같은 클러스터 안 Service 이름들 - 비밀 아니라서 값으로 직접 기입
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:19092"
            - name: PLANNING_SERVICE_BASE_URL
              value: "http://planning:8081"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # 클라우드(t3.medium, 동시 기동)에선 로컬보다 부팅이 훨씬 느려서(실측 60~90초대)
          # readiness/liveness의 initialDelaySeconds만으론 부팅 중 강제 재시작이 실제로
          # 발생함 - startupProbe가 통과할 때까지 readiness/liveness 자체를 비활성화하는
          # K8s 표준 패턴으로 전환(최대 5초*30회=150초까지 부팅 유예)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sales
spec:
  selector:
    app: sales
  ports:
    - port: 8082
      targetPort: 8082
