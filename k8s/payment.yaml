apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: choijaejun/voyageguard-payment:5697c73
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-db-secret
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db-secret
                  key: password
            # Toss 시크릿 키 - 구글 시크릿과 같은 급의 외부 자격증명이라 Secret으로 분리
            - name: TOSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-secrets
                  key: toss-secret-key
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:19092"
            - name: SALES_SERVICE_BASE_URL
              value: "http://sales:8082"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # 클라우드(t3.medium, 동시 기동)에선 로컬보다 부팅이 훨씬 느려서(실측 60~90초대)
          # readiness/liveness의 initialDelaySeconds만으론 부팅 중 강제 재시작이 실제로
          # 발생함 - startupProbe가 통과할 때까지 readiness/liveness 자체를 비활성화하는
          # K8s 표준 패턴으로 전환(최대 5초*30회=150초까지 부팅 유예)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment
spec:
  selector:
    app: payment
  ports:
    - port: 8083
      targetPort: 8083
