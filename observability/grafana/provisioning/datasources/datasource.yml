# Grafana가 뜨자마자 이 데이터소스를 자동으로 등록함(UI에서 수동 설정 불필요).
# url이 host.docker.internal이 아니라 prometheus인 이유: Grafana와 Prometheus는 둘 다
# 같은 docker-compose 네트워크 안의 컨테이너라서, 서로를 서비스 이름으로 바로 찾을 수 있음
# (host.docker.internal은 "컨테이너 -> 호스트"용이었고, 이건 "컨테이너 -> 컨테이너"라 다름).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
