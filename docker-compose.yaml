services:
  # BC별로 완전히 독립된 MySQL 컨테이너 4개(Planning/Sales/Payment/Auth) - "다른 BC 테이블과
  # SQL로 JOIN하는 백도어"를 물리적으로 원천 차단하기 위함. 컨테이너를 1개(스키마만 분리)가
  # 아니라 4개로 가는 이유: 3번 단계(레포 물리 분리)에서 어차피 필요한 구성이고, Spring 쪽
  # 코드(DataSource/EntityManagerFactory/TransactionManager 4세트)는 컨테이너가 1개든 4개든
  # 완전히 동일해서(차이는 JDBC URL 하나뿐) 지금 4개로 가는 비용이 거의 없음.
  mysql-planning:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: voyageguard1234
      MYSQL_DATABASE: voyageguard_planning
    ports:
      - "3307:3306"
    volumes:
      - mysql-planning-data:/var/lib/mysql
    command: --max_connections=200
    # planning 서비스가 DB "컨테이너 시작"이 아니라 "접속 가능한 상태"까지 기다리게 함
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pvoyageguard1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-sales:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: voyageguard1234
      MYSQL_DATABASE: voyageguard_sales
    ports:
      - "3308:3306"
    volumes:
      - mysql-sales-data:/var/lib/mysql
    # 기본 151로는 Hikari 풀(100) + 낙관적 락 REQUIRES_NEW 여분을 감당 못해서 부하테스트를 위해 늘림
    command: --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pvoyageguard1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-payment:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: voyageguard1234
      MYSQL_DATABASE: voyageguard_payment
    ports:
      - "3309:3306"
    volumes:
      - mysql-payment-data:/var/lib/mysql
    command: --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pvoyageguard1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: voyageguard1234
      MYSQL_DATABASE: voyageguard_auth
    ports:
      - "3310:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    command: --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pvoyageguard1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 각 서비스의 /actuator/prometheus를 15초마다 긁어가서 시계열로 저장하는 메트릭 서버.
  # host.docker.internal은 Docker Desktop(macOS/Windows) 전용으로 "컨테이너 -> 호스트"
  # 접근에 쓰는 특수 DNS - 지금은 서비스들을 로컬에서 직접(gradlew bootRun) 띄우고 있어서
  # 필요함. 나중에 K8s로 가면 서비스들도 컨테이너가 되므로 이 값은 서비스명으로 바뀔 것.
  prometheus:
    image: prom/prometheus:v3.0.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 로그 저장소. 로그 내용 전체가 아니라 라벨(job 등)만 색인해서 가볍다 - Elasticsearch류와의
  # 가장 큰 차이점. 앱은 Loki 존재 자체를 몰라도 됨(그냥 콘솔/파일에 로그 찍기만 함).
  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"

  # 로그 파일을 지켜보다가(tail) 새 줄이 생기면 Loki로 전송하는 수집 에이전트.
  # 지금은 서비스들을 gradlew bootRun으로 직접 띄우고 있어서 각 레포의 logs/ 폴더를
  # 상대경로로 마운트함(4개 서비스 레포가 이 레포와 형제 디렉토리로 clone돼있다는 전제) -
  # 나중에 K8s로 가면 파일 대신 컨테이너 stdout을 읽는 방식으로 자연스럽게 바뀔 부분.
  promtail:
    image: grafana/promtail:3.3.2
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - ../voyageguard-planning/logs:/var/log/planning
      - ../voyageguard-sales/logs:/var/log/sales
      - ../voyageguard-payment/logs:/var/log/payment
      - ../voyageguard-auth/logs:/var/log/auth
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # Prometheus(+ 나중에 Loki)를 데이터소스로 붙여 시각화하는 대시보드 서버.
  # 순수 시각화 도구라 앱 코드에는 영향 없음. admin/admin으로 로컬 로그인.
  grafana:
    image: grafana/grafana-oss:11.4.0
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

  # --- 앱 서비스 4개 (Docker Hub에 push된 이미지 기반) ---
  # 포트폴리오 시연용: 이 4개 + 위 인프라만으로 `docker compose up -d` 한 방으로 전체 MSA가 뜸.
  # 로컬 개발(gradlew bootRun)과는 별개 경로 - Prometheus 스크랩 대상은 아직 host.docker.internal
  # 기준이라, 이 컨테이너들의 메트릭/로그는 관측성 스택에 안 잡히는 게 알려진 제약(다음 과제).
  planning:
    image: choijaejun/voyageguard-planning:latest
    # profile 지정 - 그냥 `docker compose up -d`로는 안 뜨고, `--profile hub-images` 붙여야
    # 뜸. 안 그러면 소스 직접 빌드(gradlew bootRun)로 개발하려는 사람이 인프라만 띄우려고
    # `docker compose up -d` 했을 때 이 컨테이너도 같이 떠서 같은 포트를 두고 충돌 남
    profiles: ["hub-images"]
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-planning:3306/voyageguard_planning
      SALES_SERVICE_BASE_URL: http://sales:8082
    depends_on:
      mysql-planning:
        condition: service_healthy

  sales:
    image: choijaejun/voyageguard-sales:latest
    profiles: ["hub-images"]
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-sales:3306/voyageguard_sales
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PLANNING_SERVICE_BASE_URL: http://planning:8081
    depends_on:
      mysql-sales:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  payment:
    image: choijaejun/voyageguard-payment:latest
    profiles: ["hub-images"]
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-payment:3306/voyageguard_payment
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SALES_SERVICE_BASE_URL: http://sales:8082
      # 실제 Toss 테스트 키 없으면 결제 승인(PG 호출)만 안 되고 나머지는 정상 동작
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
    depends_on:
      mysql-payment:
        condition: service_healthy
      kafka:
        condition: service_started

  auth:
    image: choijaejun/voyageguard-auth:latest
    profiles: ["hub-images"]
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/voyageguard_auth
      # 구글 시크릿이 비어있으면 OAuth2Client 빈 생성 자체가 실패해 기동이 안 되는 걸 확인함(2026-09-07) -
      # 더미 값으로 기동은 되게 하고, 구글 로그인 버튼만 비활성(로컬 이메일 회원가입/로그인은 정상)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
    depends_on:
      mysql-auth:
        condition: service_healthy

volumes:
  mysql-planning-data:
  mysql-sales-data:
  mysql-payment-data:
  mysql-auth-data: