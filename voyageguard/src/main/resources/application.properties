spring.application.name=voyageguard

# BC별로 물리 분리된 MySQL 컨테이너 4개(docker-compose.yaml 참고) - DataSource/EntityManagerFactory/
# TransactionManager도 각 BC의 infrastructure/config/xxxDataSourceConfig.java에서 따로 만듦
# (hibernate.hbm2ddl.auto/show_sql 같은 JPA 설정도 spring.jpa.*가 아니라 그 안에서 직접 지정함 -
# HibernateJpaAutoConfiguration을 껐기 때문에 spring.jpa.*는 더 이상 아무도 안 읽음).
spring.datasource.planning.jdbc-url=jdbc:mysql://localhost:3307/voyageguard_planning
spring.datasource.planning.username=root
spring.datasource.planning.password=voyageguard1234

spring.datasource.sales.jdbc-url=jdbc:mysql://localhost:3308/voyageguard_sales
spring.datasource.sales.username=root
spring.datasource.sales.password=voyageguard1234
# 기본값(10)이면 REQUIRES_NEW(낙관적 락 재시도)가 커넥션을 2배로 먹어서 100동시요청 부하테스트에서
# 풀이 고갈돼 커넥션 풀 데드락이 남 - 부하테스트를 위해 늘림. 100(동시요청수만큼)은 이론상 최악의
# 경우(모든 요청이 바깥 커넥션부터 선점) 여전히 데드락 가능 - 완전히 안전한 2*동시요청수(200)로
# 올림. MySQL 쪽도 docker-compose.yaml에서 max_connections=200으로 맞춰둠.
spring.datasource.sales.maximum-pool-size=200

spring.datasource.payment.jdbc-url=jdbc:mysql://localhost:3309/voyageguard_payment
spring.datasource.payment.username=root
spring.datasource.payment.password=voyageguard1234

spring.datasource.auth.jdbc-url=jdbc:mysql://localhost:3310/voyageguard_auth
spring.datasource.auth.username=root
spring.datasource.auth.password=voyageguard1234

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
# Outbox payload가 이미 직렬화된 JSON 문자열이라, Kafka 레벨에서는 그냥 String으로만 주고받음
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# 이미 발행된(테스트 중 쌓인) 메시지도 놓치지 않고 처음부터 소비
spring.kafka.consumer.auto-offset-reset=earliest

# Toss Payments 시크릿 키
toss.secret-key=${TOSS_SECRET_KEY:}

# 구글 OAuth2 - registrationId가 "google"이면 Spring Security가 authorization-uri/token-uri/
# user-info-uri/jwk-set-uri를 CommonOAuth2Provider 기본값으로 자동 채워줌 - client-id/secret만 있으면 됨
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# 우리 자체 JWT 서명 키 - 비대칭키(RSA). 개인키로만 발급하고 공개키로 검증하는 구조라,
# 나중에 AWS API Gateway로 분리되면 공개키만 JWKS로 공개해서 Gateway 내장 JWT 검증
# 기능을 그대로 쓸 수 있음(대칭키였다면 시크릿을 Gateway와 공유해야 해서 그 기능을 못 씀).
# 구글 시크릿과 달리 외부 계정에 안 묶여있고 우리 서버만 쓰는 값이라 DB 비밀번호처럼
# 로컬 전용으로 평문 커밋(운영 배포 시엔 환경변수/Secrets Manager로 분리 필요)
jwt.private-
jwt.public-
jwt.expiration-ms=3600000

# Inventory 재고 차감 동시성 제어 방식 - pessimistic(기본) / optimistic / redis-decr
inventory.lock-strategy=pessimistic

# Sales가 Planning을, Payment가 Sales를 동기 REST로 호출할 때 쓰는 주소 - 지금은 전부 같은
# 프로세스(자기 자신)를 가리키지만, MSA 분리 후엔 각 서비스의 실제 주소로만 바꾸면 됨
# (호출하는 쪽 코드는 안 바뀜)
planning.service.base-url=http://localhost:8080
sales.service.base-url=http://localhost:8080