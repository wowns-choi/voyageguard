spring.application.name=voyageguard

spring.datasource.url=jdbc:mysql://localhost:3307/voyageguard
spring.datasource.username=root
spring.datasource.password=voyageguard1234
# 기본값(10)이면 REQUIRES_NEW(낙관적 락 재시도)가 커넥션을 2배로 먹어서 100동시요청 부하테스트에서
# 풀이 고갈돼 커넥션 풀 데드락이 남 - 부하테스트를 위해 늘림. 100(동시요청수만큼)은 이론상 최악의
# 경우(모든 요청이 바깥 커넥션부터 선점) 여전히 데드락 가능 - 완전히 안전한 2*동시요청수(200)로
# 올림. MySQL 쪽도 docker-compose에서 max_connections=200으로 맞춰둠.
spring.datasource.hikari.maximum-pool-size=200

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
# Outbox payload가 이미 직렬화된 JSON 문자열이라, Kafka 레벨에서는 그냥 String으로만 주고받음
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# 이미 발행된(테스트 중 쌓인) 메시지도 놓치지 않고 처음부터 소비
spring.kafka.consumer.auto-offset-reset=earliest

# Toss Payments 시크릿 키
toss.secret-key=${TOSS_SECRET_KEY:}

# 구글 OAuth2 - registrationId가 "google"이면 Spring Security가 authorization-uri/token-uri/
# user-info-uri/jwk-set-uri를 CommonOAuth2Provider 기본값으로 자동 채워줌 - client-id/secret만 있으면 됨
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# 우리 자체 JWT 서명 키 - 구글 시크릿과 달리 외부 계정에 안 묶여있고 우리 서버만 쓰는 값이라
# DB 비밀번호처럼 로컬 전용으로 평문 커밋(운영 배포 시엔 환경변수로 분리 필요)
jwt.secret=uFo3LiDHnElGITadWpH+HVFo/PiFiiAXga7vWafUDH+WVJBFE94K2LHyypRznaRTJ/yJmr0jvzhXWB+4/dSXfA==
jwt.expiration-ms=3600000

# Inventory 재고 차감 동시성 제어 방식 - pessimistic(기본) / optimistic / redis-decr
inventory.lock-strategy=pessimistic

# Sales가 Planning을, Payment가 Sales를 동기 REST로 호출할 때 쓰는 주소 - 지금은 전부 같은
# 프로세스(자기 자신)를 가리키지만, MSA 분리 후엔 각 서비스의 실제 주소로만 바꾸면 됨
# (호출하는 쪽 코드는 안 바뀜)
planning.service.base-url=http://localhost:8080
sales.service.base-url=http://localhost:8080